[project]
name = "clearings"
version = "0.1.0"
description = "Embedded backend execution through a shared Rust scheduling core"
requires-python = ">=3.11,<3.15"
license = "Apache-2.0"

[build-system]
requires = ["maturin==1.15.0"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "../../bindings/python/Cargo.toml"
python-source = "src"
module-name = "clearings._native"
bindings = "pyo3"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1", "mypy>=1", "ruff>=0.12"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
strict = true

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["_control.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
