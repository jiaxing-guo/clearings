name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: node scripts/check-plugin-metadata.mjs
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
  validate:
    needs: identity
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      id-token: write
    with:
      full: true
  website:
    needs: identity
    uses: ./.github/workflows/website.yml
    permissions:
      contents: read
      pages: write
      id-token: write
  publish:
    needs: [identity, validate, website]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: clearings-*
          path: packages
      - name: Prepare the verified archives
        run: |
          tag=$(cat plugins/clearings/runtime-version)
          for target in x86_64-unknown-linux-gnu aarch64-apple-darwin; do
            (cd "packages/clearings-$target" && sha256sum -c SHA256SUMS)
            python3 scripts/release-asset.py "packages/clearings-$target/clearings.tar.gz" release "$tag"
          done
          cat release/*.sha256 > release/SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate
          path: release/
          if-no-files-found: error
          retention-days: 14
      - name: Publish checked native packages
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          case "$RELEASE_TAG" in
            *-*) gh release create "$RELEASE_TAG" --verify-tag --prerelease --generate-notes release/*.tar.gz release/SHA256SUMS ;;
            *) gh release create "$RELEASE_TAG" --verify-tag --generate-notes release/*.tar.gz release/SHA256SUMS ;;
          esac
