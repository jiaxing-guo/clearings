name: Packages
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check package selection and plugin bootstrap
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: rustup show
      - name: Check dependency license material
        run: python3 scripts/package.py target/release/clearings "$RUNNER_TEMP/clearings-package" --licenses-only
      - run: cargo build --release --locked --workspace
      - name: Package executable and licenses
        run: python3 scripts/package.py target/release/clearings "$RUNNER_TEMP/clearings-package"
      - name: Verify extracted artifact without language runtimes
        run: |
          mkdir "$RUNNER_TEMP/clearings-installed"
          tar -xzf "$RUNNER_TEMP/clearings-package/clearings.tar.gz" -C "$RUNNER_TEMP/clearings-installed"
          python3 scripts/verify-package.py "$RUNNER_TEMP/clearings-installed/clearings"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: clearings-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/clearings-package/clearings.tar.gz
            ${{ runner.temp }}/clearings-package/SHA256SUMS
      - name: Prepare versioned release archive
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/release-asset.py "$RUNNER_TEMP/clearings-package/clearings.tar.gz" "$RUNNER_TEMP/release" "$RELEASE_TAG"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: release-${{ matrix.os }}
          path: ${{ runner.temp }}/release/*
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Publish checked native packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cat release/*.sha256 > release/SHA256SUMS
          case "$RELEASE_TAG" in
            *-*) gh release create "$RELEASE_TAG" --verify-tag --prerelease --generate-notes release/*.tar.gz release/SHA256SUMS ;;
            *) gh release create "$RELEASE_TAG" --verify-tag --generate-notes release/*.tar.gz release/SHA256SUMS ;;
          esac
