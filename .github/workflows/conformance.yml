name: Context conformance

on:
  pull_request:
    paths:
      - 'src/**'
      - 'runtime/rust/**'
      - 'programs/**'
      - 'scripts/prepare-context-native.mjs'
      - 'scripts/check-bootstrap-demo.mjs'
      - 'scripts/lib/bootstrap-source-snapshot.mjs'
      - 'benchmarks/sources/**'
      - 'schemas/**'
      - 'specifications/clearings/conformance/**'
      - 'tests/**'
      - 'scripts/check-context-conformance.mjs'
      - 'scripts/check-markdown-docs.mjs'
      - 'docs/**'
      - 'package*.json'
      - 'tsconfig.json'
      - '.github/workflows/conformance.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: rustup show active-toolchain
        working-directory: runtime/rust
      - run: npm ci --ignore-scripts
      - run: npm run native:prepare
      - run: npm run test:conformance
      - run: npm run docs:check:markdown
      - run: npm test
      - run: node scripts/check-bootstrap-demo.mjs
