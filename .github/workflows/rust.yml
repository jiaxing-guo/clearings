name: Rust backend

on:
  pull_request:
    paths:
      - 'runtime/rust/**'
      - 'src/compiler/**'
      - 'src/specification/**'
      - 'src/conformance/**'
      - 'tests/native-context.test.mjs'
      - 'scripts/prepare-context-native.mjs'
      - 'src/program/**'
      - 'src/cli/**'
      - 'programs/**'
      - 'schemas/program.v0.1.json'
      - 'tests/helpers/program-closure-reference.mjs'
      - 'tests/compiler-conformance.test.mjs'
      - 'tests/program-compiled-artifacts.test.mjs'
      - 'tests/program-rust-codegen.test.mjs'
      - 'tests/native/**'
      - 'tests/compiled/**'
      - 'tests/compiler-runner.test.mjs'
      - 'docs/**'
      - 'scripts/measure-rust-closure.mjs'
      - 'scripts/check-markdown-docs.mjs'
      - 'package*.json'
      - '.github/workflows/rust.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: rustup show active-toolchain
        working-directory: runtime/rust
      - run: npm ci --ignore-scripts
      - run: npm run check:rust
      - run: npm run test:rust
      - run: npm run test:compiler
      - run: npm run docs:check:rust
