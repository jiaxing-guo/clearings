name: Program IR

on:
  pull_request:
    paths:
      - 'src/**'
      - 'schemas/**'
      - 'programs/**'
      - 'tests/program*.test.mjs'
      - 'tests/helpers/program-closure-reference.mjs'
      - 'scripts/generate-program-schema.py'
      - 'scripts/build-required-closure-program.mjs'
      - 'scripts/check-markdown-docs.mjs'
      - 'docs/**'
      - 'README.md'
      - 'package*.json'
      - 'tsconfig.json'
      - '.github/workflows/program.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  program:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: rustup show active-toolchain
        working-directory: runtime/rust
      - run: npm ci --ignore-scripts
      - run: npm run native:prepare
      - run: npm run test:program
      - run: npm run docs:check:markdown
