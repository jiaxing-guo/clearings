name: Formatting and lint

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  formatting:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install pinned Python checks
        run: |
          python3 -m venv .venv-tools
          .venv-tools/bin/python -m pip install -r requirements-dev.txt
      - run: npm run format:check
      - run: npm run lint
      - run: npm run test:hooks
      - name: Use the minimum supported Node version
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.0.0'
      - run: npm run lint
      - run: node --test --test-name-pattern='lint command' tests/check-hooks.test.mjs
