name: Python SDK

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.8
      - run: rustup show
      - run: uv sync --project python/clearings --frozen --group dev
      - run: python scripts/generate-python-control.py --check
      - run: uv run --project python/clearings --frozen --group dev ruff check --config python/clearings/pyproject.toml python/clearings/src/clearings
      - run: uv run --project python/clearings --frozen --group dev ruff format --check --config python/clearings/pyproject.toml python/clearings/src/clearings tests/python examples/product-cards/python.py
      - run: uv run --project python/clearings --frozen --group dev mypy --config-file python/clearings/pyproject.toml python/clearings/src/clearings
      - run: uv run --project python/clearings --frozen --group dev pytest -c python/clearings/pyproject.toml tests/python -q
      - run: uv build --project python/clearings --wheel --out-dir dist/python
      - run: python scripts/check-python-package.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: python-${{ runner.os }}
          path: dist/python/
          if-no-files-found: error
  installed:
    needs: native
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    runs-on: ubuntu-24.04
    container: python:${{ matrix.python }}-slim-bookworm
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: python-Linux
      - run: python -c "import shutil; assert shutil.which('cargo') is None; assert shutil.which('rustc') is None; assert shutil.which('node') is None"
      - run: python -m pip install --no-index --no-deps ./*.whl
      - run: python check.py
  parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.8
      - run: npm ci --ignore-scripts
      - run: rustup show
      - run: npm run build:native
      - run: npm run build:sdk
      - run: npm run check:node-package
      - run: uv build --project python/clearings --wheel --out-dir dist/python
      - run: python scripts/check-python-package.py
      - run: python scripts/check-sdk-parity.py
