name: Node SDK

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: rustup show
      - run: npm run build:native
      - run: npm run build:sdk
      - run: node scripts/generate-control-types.mjs --check
      - run: npm run test:sdk
      - run: npm run check:node-package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: node-${{ runner.os }}
          path: dist/node/
          if-no-files-found: error
  installed:
    needs: native
    runs-on: ubuntu-24.04
    container: node:24-bookworm-slim
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: node-Linux
      - run: '! command -v rustc && ! command -v cargo'
      - run: npm install --offline --ignore-scripts --no-audit --no-fund ./*.tgz
      - run: node check.mjs
