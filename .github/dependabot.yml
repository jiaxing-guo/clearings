version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: build
    groups:
      rust-compatible:
        patterns: ['*']
        update-types: [minor, patch]
      rust-security:
        applies-to: security-updates
        patterns: ['*']
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: build
    groups:
      tooling-compatible:
        patterns: ['*']
        update-types: [minor, patch]
      tooling-security:
        applies-to: security-updates
        patterns: ['*']
  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: build
    groups:
      website-compatible:
        patterns: ['*']
        update-types: [minor, patch]
      website-security:
        applies-to: security-updates
        patterns: ['*']
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    commit-message:
      prefix: build
    groups:
      python-compatible:
        patterns: ['*']
        update-types: [minor, patch]
      python-security:
        applies-to: security-updates
        patterns: ['*']
